<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Picture Slide Show</title>
  <!-- Include Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/header.css">

</head>

<body>
  <div class="head">
    <div class="head-left-section">
      <a class="head-link" href="index.html">
        Slide Show
      </a>
    </div>
    <div class="head-middle-section">

    </div>
    <div class="head-right-section">

    </div>
  </div>
  <h1 class="text-center">Picture Slide Show</h1>
  <main class="container">
    <section class="slidesContainer">
      <!-- Carousel -->
      <div id="pictureCarousel" class="carousel" data-bs-ride="carousel">
        <div class="carousel-inner" id="carouselContent">
          <!-- Carousel images dynamically populated -->
        </div>
        <section class="controlContainer">
          <button class="carousel-control-prev" type="button" data-bs-target="#pictureCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#pictureCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
          <!-- Start/Stop Button -->
          <!-- Random/Sequential Button -->
          <div class="text-center mt-3">
            <button id="toggleSlideshow" class="btn btn-primary">Stop Slideshow</button>
            <button id="toggleMode" class="btn btn-secondary">Switch to Random</button>
            <button id="toggleDirection" class="btn btn-primary">Go Reverse</button>
          </div>
        </section>
      </div>
    </section>

  </main>
  <!-- Include Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>

  <footer>
    <div class="foot">
      &copy; 2025 - Picture Slide Show
      &nbsp;|&nbsp; <a href="https://purple-glacier-08ca4f60f.6.azurestaticapps.net/">Cover</a>
      &nbsp;|&nbsp; <a href="documentation.html">Documentation</a>
      &nbsp;|&nbsp; <a href="#">Back to Top</a>
    </div>
  </footer>
</body>

</html>
